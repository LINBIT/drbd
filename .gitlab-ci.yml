variables:
  RELEASE_BRANCH: master
  DRBD_VERSION_BASE: 9.3.0
  DRBD9_TESTS_REF: master
  DRBD_MSIM_TESTS_REF: main
  # Build containers for the version 1 netlink dialect (CONFIG_DRBD_NL_DRBD1)
  # jobs. NL_DRBD1_BUILD_IMAGE must carry exactly the kernel of the
  # drbd9-tests VM tagged nl-drbd1 (virter/vms.toml): build:nl-drbd1 hands
  # its modules to that VM, and checks the two agree. NL_DRBD1_FLOOR_IMAGE
  # is any kernel below the dialect's v6.13 floor.
  NL_DRBD1_BUILD_IMAGE: lbbuild-dists.at.linbit.com/dc-ubuntu-resolute-amd64:7.0.0-14-generic
  NL_DRBD1_FLOOR_IMAGE: lbbuild-dists.at.linbit.com/dc-debian-trixie-amd64:6.12.35
  BUILD_HELPERS_VERSION: f25470fd968061a3353c114c8b7a0ea7eb567b7e
  # we have to change the way GitLab CI clones the repository.
  # by default, it is shallow, which gives us a wrong commit count when
  # we do `git rev-list --count origin/master` below.
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal
  # comma separated list of base images to exclude when testing
  EXCLUDE_BASE_IMAGES: rhel-7-drbd-k1160

stages:
  - check
  - build
  - test

.setup-lbbuild:
  before_script:
    - . gitlab-utils.sh
    - ci_prepare_tools
    - ci_fetch_rq
    - ci_fetch_lbbuildctl
    - git clone --branch ${DRBD9_TESTS_REF} https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd9-tests.git
    - |
      kernels_from_vms() {
        # FIXME: mainline build containers are currently broken. Re-enable once they are fixed.
        python3 .gitlab/kernels-from-vms.py < drbd9-tests/virter/vms.toml | grep -v '^mainline '
      }

      # parameters: [version]
      # select all "build targets" for the given drbd version,
      # ignoring some distros that always fail in CI anyway
      all_kernels() {
        local version="$1"
        lbbuildctl build drbd --ci -v $version --arch amd64 --debug debugSpecJson | \
          jq -r 'map(.image + " " + .aux_version) | unique[]' | \
          grep -v ^sles12 | grep -v ^rhel7 | grep -v ^sles15-sp0 | grep -v ^docker
      }

      # upload the tarball in the current directory to the lbbuild-upstream
      # repository on pulp.
      upload_tarball() {
        local tarball
        tarball=$(ls drbd-*.tar.gz)
        pulp file content upload --repository lbbuild-upstream \
          --file "$tarball" \
          --relative-path "$tarball"
      }

      # parameters: [version] [release] [rel-version] [kernels]
      # kernels should be a string with lines with the format: "[distribution] [kernel version]"
      drbd_build () {
        local version="$1"
        local release="$2"
        local rel_version="$3"
        local kernels="$4"

        set -x

        ./.gitlab/drbd-prepare-release.sh "$version" "$release" "$rel_version"
        make FORCE=1 PRESERVE_DEBIAN=1 REL_VERSION="$rel_version" tarball
        upload_tarball

        local compat_rc=0
        echo "$kernels" | parallel --colsep ' ' -k -j24 --joblog compat.log \
          lbbuildctl build drbd --arch amd64 --ci -v "$rel_version" --compat-only \
            -d {1} -k {2} \
            || compat_rc=$?

        if [ "$compat_rc" -ne 0 ]; then
          echo "Error: compat build failed" >&2
          parse_joblog.py drbd compat.log
          exit $compat_rc
        fi

        pushd drbd/drbd-kernel-compat
        local compat_hs
        while read line; do
          kver=${line#* } # everything after " " -> the kernel version
          curl -fsSLO "$LINBIT_PULP_BASE_URL/pulp/content/file/drbd-compat/$rel_version/compat.h.$kver"
          compat_hs+=("compat.h.$kver")
        done <<< "$kernels"
        ./build_cocci_cache.sh ${compat_hs[@]}
        popd

        make -j $(nproc) -C drbd compat
        make FORCE=1 PRESERVE_DEBIAN=1 REL_VERSION="$rel_version" tarball
        upload_tarball

        local build_rc=0
        echo "$kernels" | parallel --colsep ' ' -k -j24 --joblog parallel.log \
          lbbuildctl build drbd --arch amd64 --ci -v "$rel_version" \
            -d {1} -k {2} \
            || build_rc=$?

        parse_joblog.py drbd parallel.log

        if [ "$build_rc" -ne 0 ]; then
          exit $build_rc
        fi

        set +x
      }

# rules clause determining whether to build
.rules-build:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH

check:coccicheck:
  stage: check
  extends: [ .rules-build ]
  image: docker.io/linbit/coccinelle:1.2
  script:
    - make coccicheck

check:pychecks:
  stage: check
  extends: [ .rules-build ]
  image: docker.io/library/python:3
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  script:
    - pip install tree-sitter tree-sitter-c
    - make pychecks

check:cocci-syntax:
  stage: check
  extends: [ .rules-build ]
  image: docker.io/linbit/coccinelle:1.2
  script:
    - make cocci-syntax

check:check-compat:
  stage: check
  extends: [ .rules-build ]
  image: docker.io/linbit/coccinelle:1.2
  script:
    - make check-compat

check:checkpatch.pl:
  stage: check
  rules:
    - if: $CI_MERGE_REQUEST_ID
  image: docker.io/library/perl:5
  variables:
    LINUX_SCRIPTS: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/scripts
  script:
    - curl -sSfLO $LINUX_SCRIPTS/checkpatch.pl
    - curl -sSfLO $LINUX_SCRIPTS/spelling.txt
    - curl -sSfLO $LINUX_SCRIPTS/const_structs.checkpatch
    - chmod +x checkpatch.pl
    - git fetch --no-tags origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - base=$(git merge-base remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} HEAD)
    - CHECKPATCH=./checkpatch.pl misc/checkpatch.sh commits "$base"

check:nl-core-boundary:
  stage: check
  extends: [ .rules-build ]
  image: docker.io/library/alpine:3
  script:
    - |
      set -e
      re='#include <net/(genetlink|netlink)\.h>|\bnla_(put|nest|get)|\bgenlmsg_|struct genl_info|genl_info_userhdr|_to_skb\(|_from_attrs\(|drbd_nl_family|DRBD_NLA_'
      # Make sure grep understands the pattern (BusyBox/musl may not know \b),
      # so that a broken regex fails the job instead of passing vacuously.
      printf 'genlmsg_put(\n' | grep -qE "$re" || { echo "self-test failed: grep does not understand the pattern"; exit 1; }
      if grep -nE "$re" drbd/drbd_nl.c; then
        echo "drbd_nl.c is the wire-format-neutral netlink core; genetlink code belongs in a dialect adapter (drbd_nl_legacy.c)"; exit 1
      fi

check:84-vendored:
  stage: check
  # .rules-build's triggers, but a merge request only runs this when it
  # touches something that can alter the vendored files: the files
  # themselves, the Coccinelle source list or rules that could rewrite
  # them, or this job. The kernel fetch below is not worth repeating for
  # every unrelated merge request. Release-branch pushes always run it.
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - .gitlab-ci.yml
        - drbd/drbd-84/**/*
        - drbd/Makefile.cocci-sources
        - drbd/drbd-kernel-compat/cocci/**/*
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
  image: docker.io/library/alpine:3
  variables:
    MAINLINE_COMMIT: 8098eeb693c4cc4e774c62fbd4875197cb5578ce
  script:
    - apk add --no-cache git bash diffutils
    - git init -q /tmp/linux
    - git -C /tmp/linux fetch -q --depth 1
        https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
        $MAINLINE_COMMIT
    - KDIR=/tmp/linux drbd/drbd-84/check-84-vendored.sh

# The version 1 netlink dialect (CONFIG_DRBD_NL_DRBD1) is never part of a
# package build, so without these jobs drbd_nl_84.c is dead to every pipeline.
# Both run automatically for a merge request that touches what the dialect is
# built from, are manual otherwise, and always run on the release branch.
# git is for the drbd9-tests clone and for the build tag, coccinelle because
# a git checkout must generate its compat patch locally.
.rules-nl-drbd1:
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - .gitlab-ci.yml
        - drbd/drbd-84/**/*
        - drbd/drbd-headers
        - drbd/drbd_nl_84.c
        - drbd/drbd_nl.c
        - drbd/drbd_nl.h
        - drbd/drbd_legacy_84.c
        - drbd/drbd_legacy_84.h
        - drbd/Kbuild.drbd
        - drbd/Kbuild.drbd-module-sources
        - drbd/Makefile.cocci-sources
    - if: $CI_MERGE_REQUEST_ID
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH

# Build the module with the v1 dialect against the kernel of the drbd9-tests
# VM tagged nl-drbd1, warning-free, and keep the modules for test:compat84.
# The version is set the way build:for-tests names its packages, so the test
# harness's version check passes against /proc/drbd.
build:nl-drbd1:
  stage: build
  extends: [ .rules-nl-drbd1 ]
  image: $NL_DRBD1_BUILD_IMAGE
  script:
    # lbbuild containers run as an unprivileged user with passwordless sudo
    - sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends coccinelle git > /dev/null
    # the checkout belongs to the runner, not to this user, and git refuses
    # to describe it (drbd_buildtag.c) unless told it is safe
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git clone -q --branch ${DRBD9_TESTS_REF} https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd9-tests.git
    - |
      set -e
      # The one kernel this container carries.
      kernelrelease=$(ls /lib/modules)
      test "$(echo "$kernelrelease" | wc -l)" -eq 1
      # ... must be the kernel of the VM the modules are for.
      vm_kernels=$(python3 -c '
      import sys, tomllib
      vms = tomllib.load(open(sys.argv[1], "rb"))["vms"]
      print("\n".join(v["metadata"]["KernelRelease"] for v in vms if "nl-drbd1" in v["vm_tags"]))
      ' drbd9-tests/virter/vms.toml)
      # Without such a VM (drbd9-tests before its compat84 variant) there is
      # nothing to match and nothing that would load these modules.
      if [ -z "$vm_kernels" ]; then
        echo "no drbd9-tests VM tagged nl-drbd1 at DRBD9_TESTS_REF=$DRBD9_TESTS_REF; not checking the kernel" >&2
      elif ! echo "$vm_kernels" | grep -qx "$kernelrelease"; then
        echo "NL_DRBD1_BUILD_IMAGE has kernel $kernelrelease, but the drbd9-tests VMs tagged nl-drbd1 run:" >&2
        echo "$vm_kernels" >&2
        echo "Point NL_DRBD1_BUILD_IMAGE at a dc-<distro>-amd64:<kernel> image with one of those." >&2
        exit 1
      fi
      if [ "$CI_COMMIT_BRANCH" = "$RELEASE_BRANCH" ]; then
        DRBD_VERSION=$DRBD_VERSION_BASE.latest
      else
        DRBD_VERSION=$DRBD_VERSION_BASE.$CI_COMMIT_SHA
      fi
      sed -i -re "s/(#define REL_VERSION) .*/\1 \"$DRBD_VERSION\"/" drbd/linux/drbd_config.h
      make -C drbd KDIR=/lib/modules/$kernelrelease/build CONFIG_DRBD_NL_DRBD1=y -j"$(nproc)" 2>&1 | tee build.log
      test "${PIPESTATUS[0]}" -eq 0
      if grep -E ': warning:' build.log; then
        echo "compiler warnings in a CONFIG_DRBD_NL_DRBD1=y build" >&2
        exit 1
      fi
      # The dialect registers itself under this name; make sure it was compiled in.
      grep -qaF 'drbd-8.4' drbd/build-current/drbd.ko
      mkdir -p nl-drbd1
      cp -v drbd/build-current/*.ko nl-drbd1/
      cp -v drbd/build-current/drbd-kernel-compat/handshake/*.ko nl-drbd1/ 2>/dev/null || true
      modinfo -F vermagic nl-drbd1/drbd.ko
  artifacts:
    paths:
      - nl-drbd1/
      - build.log
    expire_in: 1 week

# The dialect refuses to build below v6.13 with a clear message rather than
# failing on a missing symbol somewhere in the vendored code. Prove that the
# guard fires, on a kernel just under the floor.
build:nl-drbd1-floor:
  stage: build
  extends: [ .rules-nl-drbd1 ]
  image: $NL_DRBD1_FLOOR_IMAGE
  script:
    # lbbuild containers run as an unprivileged user with passwordless sudo
    - sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends coccinelle git > /dev/null
    # the checkout belongs to the runner, not to this user, and git refuses
    # to describe it (drbd_buildtag.c) unless told it is safe
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      # pipefail: the if below must see make's status, not tee's
      set -e -o pipefail
      kernelrelease=$(ls /lib/modules)
      test "$(echo "$kernelrelease" | wc -l)" -eq 1
      if make -C drbd KDIR=/lib/modules/$kernelrelease/build CONFIG_DRBD_NL_DRBD1=y -j"$(nproc)" 2>&1 | tee build.log; then
        echo "CONFIG_DRBD_NL_DRBD1=y built on $kernelrelease; the v6.13 floor guard did not fire" >&2
        exit 1
      fi
      grep -q 'CONFIG_DRBD_NL_DRBD1=y needs a kernel v6.13 or later' build.log
      test ! -e drbd/build-current/drbd.ko
      echo "floor guard fired as expected on $kernelrelease"
  artifacts:
    paths:
      - build.log
    when: always
    expire_in: 1 week

build:for-tests:
  stage: build
  extends: [ .setup-lbbuild ]
  rules:
    - !reference [.rules-build, rules]
    # Useful for building DRBD without opening a merge request
    - if: $CI_PIPELINE_SOURCE == 'api'
    # Used by the tests pipeline, if a DRBD branch build is required
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
    # Useful for testing the downstream trigger used in the tests pipeline
    - if: $CI_PIPELINE_SOURCE == 'trigger'
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:$BUILD_HELPERS_VERSION
  script:
    - if [ "$CI_COMMIT_BRANCH" = "$RELEASE_BRANCH" ]; then
    -   DRBD_VERSION=$DRBD_VERSION_BASE.latest
    -   DRBD_RELEASE=$(git rev-list --count "origin/$CI_COMMIT_BRANCH")
    - else
    -   DRBD_VERSION=$DRBD_VERSION_BASE.$CI_COMMIT_SHA
    -   DRBD_RELEASE=1
    - fi
    - |
      # If the build is conditional and some packages already exist, skip the build.
      # Then the purpose of this job is just to generate build.env.
      build_packages=true
      if [ "$DRBD_BUILD_CONDITIONAL" = true ]; then
        published=$(pulp rpm content list --name-in kmod-drbd --name-in drbd-kmp-default \
              --field version,release --limit 10000 | \
            jq -r --arg v "$DRBD_VERSION" \
                  '[.[] | select(.version | startswith($v + "_")) | .version + "-" + .release] | unique
                   | sort_by([splits("[^0-9]+") | select(. != "") | tonumber])
                   | last // empty' || true)
        if [ -n "$published" ]; then
          build_packages=false
          # On the release branch $DRBD_VERSION is a rolling label, so the
          # release of the package that will be installed identifies the
          # commit under test -- $CI_COMMIT_SHA may already be newer.
          published_release=${published##*-}
          case "$published_release" in
            "$published"|''|*[!0-9]*) ;;
            *) DRBD_RELEASE=$published_release ;;
          esac
        fi
      fi
    - |
      {
        echo DRBD_VERSION=$DRBD_VERSION
        echo DRBD_RELEASE=$DRBD_RELEASE
        echo DRBD_BUILD_SHA=$CI_COMMIT_SHA
        if [ "$build_packages" = false ]; then
          echo DRBD_PACKAGE_VERSION=$published
          echo DRBD_BUILD_SKIPPED=true
        fi
      } >> build.env
    - cat build.env
    - if [ "$build_packages" = false ]; then exit 0; fi
    - drbd_build $DRBD_VERSION $DRBD_RELEASE $DRBD_VERSION "$(kernels_from_vms)"
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - drbd/drbd-kernel-compat/cocci_cache
      # Make the variables accessible through the API. See:
      # https://stackoverflow.com/questions/72202825/download-dotenv-job-artifact-via-gitlab-api
      - build.env
    when: always
    expire_in: 1 week
  needs: []

build:all:
  stage: build
  extends: [ .setup-lbbuild ]
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: manual
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'api'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'pipeline'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'trigger'
      when: manual
  allow_failure: true
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:$BUILD_HELPERS_VERSION
  script:
    - DRBD_VERSION=$DRBD_VERSION_BASE.$CI_COMMIT_SHA
    - DRBD_RELEASE=1
    - echo DRBD_VERSION=$DRBD_VERSION >> build.env
    - drbd_build $DRBD_VERSION $DRBD_RELEASE $DRBD_VERSION "$(all_kernels $DRBD_VERSION)"
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - drbd/drbd-kernel-compat/cocci_cache
    when: always
    expire_in: 1 week
  needs: []

.test:
  tags:
    - libvirt
  cache:
    paths:
      - download
  before_script:
    - |
      set -e
      run_test() {
        git clone --branch ${DRBD9_TESTS_REF} https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd9-tests.git
        . drbd9-tests/virter/version.env

        git init build-helpers -q -b unused
        git -C build-helpers fetch -q --depth 1 $CI_SERVER_PROTOCOL://gitlab-ci-token:${CI_JOB_TOKEN}@$CI_SERVER_HOST:$CI_SERVER_PORT/linbit/build-helpers.git $BUILD_HELPERS_VERSION
        git -C build-helpers checkout -q $BUILD_HELPERS_VERSION
        . build-helpers/gitlab-utils.sh

        ci_prepare_tools
        ci_fetch_rq
        ci_fetch_binary virter virter-$VIRTER_VERSION https://github.com/LINBIT/virter/releases/download/$VIRTER_VERSION/virter-linux-amd64
        ci_fetch_binary vmshed vmshed-$VMSHED_VERSION https://github.com/LINBIT/vmshed/releases/download/$VMSHED_VERSION/vmshed-linux-amd64

        export DRBD_TEST_DOCKER_IMAGE=$LINBIT_DOCKER_REGISTRY/drbd9-tests:latest
        docker image pull $DRBD_TEST_DOCKER_IMAGE

        export DRBD_VERSION=$DRBD_VERSION
        export DRBD_UTILS_VERSION=9.0.0.latest-*
        ./drbd9-tests/virter/run-test.sh "$@" --exclude-base-image "$EXCLUDE_BASE_IMAGES"
      }
  dependencies:
    - build:for-tests
  artifacts:
    # provide a convenient name so that the downloaded artifacts can be identified
    name: $CI_PROJECT_NAME-$CI_JOB_ID
    paths:
      - tests-out/
    when: always
    reports:
      junit: tests-out/test-results/*.xml
  needs:
    - build:for-tests

test:default:
  stage: test
  extends: [ .test ]
  rules:
    - if: $CI_MERGE_REQUEST_ID
  script: run_test

test:rdma:
  stage: test
  extends: [ .test ]
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - drbd/drbd_transport_rdma.c
    - if: $CI_MERGE_REQUEST_ID
      when: manual
  allow_failure: true
  script: VMSHED_TEST_SELECTION=rdma_ci run_test --variant=rdma

test:rdma2:
  stage: test
  extends: [ .test ]
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - drbd/drbd_transport_rdma2.c
    - if: $CI_MERGE_REQUEST_ID
      when: manual
  allow_failure: true
  script: VMSHED_TEST_SELECTION=rdma_ci run_test --variant=rdma2

# The whole-module simulator corpus. It compiles this commit's DRBD core
# against a userspace kernel API and runs it in one process, so it needs no
# VMs and no packages -- hence "needs: []", rather than the build:for-tests
# dependency the .test jobs have.
test:msim:
  stage: test
  rules:
    - if: $CI_MERGE_REQUEST_ID
  image: $LINBIT_DOCKER_REGISTRY/build-helpers:$BUILD_HELPERS_VERSION
  timeout: 1h
  needs: []
  before_script:
    # A full clone with tags of drbd-utils: the harness builds the drbdmeta
    # the host runs from a tagged drbd-utils commit, extracted with the
    # drbd-headers commit that tag records.
    - git clone --recurse-submodules https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd-utils.git
    - git clone --branch ${DRBD_MSIM_TESTS_REF} https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/drbd/drbd-msim-tests.git
    # `self` is this repository. A scenario pins its other versions by tag or
    # by abbreviated SHA, and the since ladder attributes a directive to a
    # release branch by containment, so both need the refs GIT_DEPTH: 0 and
    # GIT_SUBMODULE_STRATEGY: normal already fetch here.
    - |
      cat > drbd-msim-tests/drbd-msim-tests.toml <<'EOF'
      drbd = ".."
      drbd-utils = "../drbd-utils"
      scratch = "build"
      EOF
    # Fails before anything is built if a path does not resolve.
    - ( cd drbd-msim-tests && ./msim-tests config )
  # --mode drbd: DRBD is what is under test, so an unexpected failure is fatal
  # and an unexpected pass -- the normal result of a fix -- is reported.
  # --self names the commit rather than the working tree, so every version in
  # the run is immutable and the expectation resolves for the commit that ran.
  script:
    - cd drbd-msim-tests && ./msim-tests run --mode drbd --self "$CI_COMMIT_SHA" --census census.txt
  artifacts:
    # provide a convenient name so that the downloaded artifacts can be identified
    name: $CI_PROJECT_NAME-$CI_JOB_ID
    when: always
    expire_in: 1 week
    paths:
      # The per-scenario verdicts, and the report, choice log, stdout and
      # stderr of every run that did not pass.
      - drbd-msim-tests/census.txt
      - drbd-msim-tests/build/runs/

# drbdsetup-84/drbdadm-84 against the build:nl-drbd1 module on the drbd9-tests
# VM tagged nl-drbd1: the compat84 variant and selection in drbd9-tests. The
# modules travel as packages/*.ko, which provisioning installs in place of a
# DRBD package. Manual unless the dialect's sources changed, and never blocks
# the pipeline: the test infrastructure for it is young.
test:compat84:
  stage: test
  extends: [ .test ]
  rules:
    - if: $CI_MERGE_REQUEST_ID
      changes:
        - drbd/drbd-84/**/*
        - drbd/drbd-headers
        - drbd/drbd_nl_84.c
        - drbd/drbd_legacy_84.c
        - drbd/drbd_legacy_84.h
    - if: $CI_MERGE_REQUEST_ID
      when: manual
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
      when: manual
  allow_failure: true
  dependencies:
    - build:for-tests
    - build:nl-drbd1
  needs:
    - build:for-tests
    - build:nl-drbd1
  script:
    # A manual build:nl-drbd1 does not hold this job back; say so instead of
    # failing on a missing directory.
    - |
      test -d nl-drbd1 || { echo 'no modules: run build:nl-drbd1 first' >&2; exit 1; }
    - mkdir -p packages && cp -v nl-drbd1/*.ko packages/
    - VMSHED_TEST_SELECTION=compat84 run_test --variant=compat84
